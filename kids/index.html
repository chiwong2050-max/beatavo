<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beatavo Kids — dance videos for little ones</title>
  <meta name="description" content="Beatavo Kids is a simple, family-safe space for little ones to dance along with fun cartoon music videos. Big buttons, no clutter.">
  <meta name="theme-color" content="#7c4dff">
  <link rel="canonical" href="../kids/">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beatavo Kids">
  <link rel="preconnect" href="https://i.ytimg.com">
  <script>try{var t=localStorage.getItem('beatavo:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="../assets/css/styles.css">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beatavo">
  <meta property="og:title" content="Beatavo Kids — dance videos for little ones">
  <meta property="og:description" content="A simple, family-safe space for little ones to dance along with fun cartoon music videos.">
  <meta property="og:url" content="../kids/">
  <meta property="og:image" content="../assets/images/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beatavo Kids — dance videos for little ones">
  <meta name="twitter:description" content="A simple, family-safe space for little ones to dance along with fun cartoon music videos.">
  <meta name="twitter:image" content="../assets/images/og.png">
</head>
<body class="kids-page">
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../">
        <img class="brand__mark" src="../assets/icons/favicon.svg" alt="" width="32" height="32">
        Beatavo
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="../" data-i18n="nav_videos">Videos</a>
        <a href="../kids/" data-i18n="nav_kids">Kids</a>
        <a href="../playlists/" data-i18n="nav_playlists">Playlists</a>
        <a href="../favourites/" data-i18n="nav_favourites">Favourites</a>
        <a href="../privacy/" data-i18n="nav_privacy">Privacy</a>
      </nav>
      <button class="mode-toggle" id="kidsModeBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span class="mode-toggle__text" id="kidsModeText" data-i18n="kids_mode_exit">Grown-ups: exit</span>
      </button>
      <label class="lang">
        <span class="visually-hidden" data-i18n="language">Language</span>
        <select class="lang__select" data-language-picker aria-label="Language"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="kids-back">
        <a class="footer-link" href="../" data-i18n="back_home">Back to Beatavo</a>
      </div>

      <p class="kids-lock" id="kidsLock" hidden>
        <span aria-hidden="true">🔒</span>
        <span data-i18n="kids_mode_on">Kids mode is on</span>
      </p>

      <section class="hero hero--kids" aria-labelledby="kidsTitle">
        <h1 id="kidsTitle" data-i18n="kids_page_title">Beatavo Kids</h1>
        <p data-i18n="kids_page_subtitle">Big buttons, fun dances and a safe space to play along.</p>
        <div class="hero__actions">
          <button class="btn btn--play btn--kids" id="kidsPlayAll" type="button">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l10.8-6.86a1.06 1.06 0 0 0 0-1.8L9.56 4.24A1.06 1.06 0 0 0 8 5.14Z"/></svg>
            <span data-i18n="btn_play_all">Play all</span>
          </button>
          <button class="btn btn--shuffle btn--kids" id="kidsShuffle" type="button">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 4h4v4M20 4l-7.5 7.5M4 20l5.5-5.5M16 20h4v-4M20 20l-5.5-5.5M4 4l4 4"/></svg>
            <span data-i18n="btn_shuffle">Shuffle play</span>
          </button>
        </div>
      </section>

      <div class="section-head">
        <h2 data-i18n="kids_page_title">Beatavo Kids</h2>
        <span class="count" id="kidsCount"></span>
      </div>

      <div class="video-grid video-grid--kids" id="kidsGrid" aria-busy="true"></div>
    </div>
  </main>

  <!-- Kids page keeps external links to a minimum: only the YouTube embed
       inside the watch page is external. -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__tagline" data-i18n="footer_tagline">Videos are hosted on YouTube.</p>
      <nav class="footer-links" aria-label="Footer">
        <a class="footer-link" href="../privacy/" data-i18n="footer_privacy">Privacy</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="../assets/js/kids.js"></script>
</body>
</html>
