<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beatavo — fun cartoon dance videos to play along with</title>
  <meta name="description" content="Beatavo is a fast, family-safe way to watch and dance along with fun cartoon music videos. Play all, or pick from Beatavo and Beatavo Kids.">
  <meta name="theme-color" content="#7c4dff">
  <link rel="canonical" href="./">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beatavo">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="./assets/css/styles.css">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beatavo">
  <meta property="og:title" content="Beatavo — fun cartoon dance videos to play along with">
  <meta property="og:description" content="Watch and dance along with fun cartoon music videos. Family-safe, fast and free.">
  <meta property="og:url" content="./">
  <meta property="og:image" content="./assets/images/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beatavo — fun cartoon dance videos to play along with">
  <meta name="twitter:description" content="Watch and dance along with fun cartoon music videos. Family-safe, fast and free.">
  <meta name="twitter:image" content="./assets/images/og.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="./">
        <img class="brand__mark" src="./assets/icons/favicon.svg" alt="" width="32" height="32">
        Beatavo
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="#main">Videos</a>
        <a href="./privacy/">Privacy</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="container">

      <section class="hero" aria-labelledby="heroTitle">
        <h1 id="heroTitle">Pick a beat and dance along</h1>
        <p>Fun cartoon music videos for everyone. Hit play and keep dancing — the next video starts automatically.</p>
        <div class="hero__actions">
          <button class="btn btn--play" id="playAll" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l10.8-6.86a1.06 1.06 0 0 0 0-1.8L9.56 4.24A1.06 1.06 0 0 0 8 5.14Z"/></svg>
            Play all
          </button>
        </div>
      </section>

      <div class="tabs" role="tablist" aria-label="Video sections">
        <button class="tab" role="tab" id="tab-main" data-section="main"
                aria-selected="true" aria-controls="videoGrid">Beatavo</button>
        <button class="tab" role="tab" id="tab-kids" data-section="kids"
                aria-selected="false" aria-controls="videoGrid" tabindex="-1">Beatavo Kids</button>
        <button class="tab" role="tab" id="tab-favourites" data-section="favourites"
                aria-selected="false" aria-controls="videoGrid" tabindex="-1">Favourites</button>
      </div>

      <div class="toolbar">
        <label class="visually-hidden" for="search">Search videos</label>
        <input class="search" id="search" type="search" placeholder="Search videos"
               autocomplete="off" enterkeyhint="search">
      </div>

      <div class="section-head">
        <h2 id="sectionTitle">Beatavo</h2>
        <span class="count" id="sectionCount"></span>
      </div>

      <div class="video-grid" id="videoGrid" role="tabpanel" aria-labelledby="tab-main"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__tagline">Videos are hosted on YouTube.</p>
      <nav class="footer-links" aria-label="Footer">
        <a class="btn btn--coffee" href="https://buymeacoffee.com/aussieloo?ref=beatavo"
           target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h14a1 1 0 0 1 1 1v2h1.5A2.5 2.5 0 0 1 23 9.5v1A2.5 2.5 0 0 1 20.5 13H19v1a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V4Zm15 5v2h1.5a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5H19ZM5 21a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
          Buy me a coffee
        </a>
        <a class="footer-link" href="./privacy/">Privacy</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="./assets/js/home.js"></script>
</body>
</html>
