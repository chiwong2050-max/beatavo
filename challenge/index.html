<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dance challenge · Beatavo</title>
  <meta name="description" content="Take the Beatavo dance challenge: five fun cartoon dance videos back to back with a 3-2-1 countdown. No accounts, just dancing.">
  <meta name="theme-color" content="#7c4dff">
  <link rel="canonical" href="../challenge/">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beatavo">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <script>try{var t=localStorage.getItem('beatavo:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="../assets/css/styles.css">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beatavo">
  <meta property="og:title" content="Beatavo dance challenge">
  <meta property="og:description" content="Five dance videos back to back. Can you keep up?">
  <meta property="og:url" content="../challenge/">
  <meta property="og:image" content="../assets/images/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beatavo dance challenge">
  <meta name="twitter:description" content="Five dance videos back to back. Can you keep up?">
  <meta name="twitter:image" content="../assets/images/og.png">
</head>
<body class="challenge-page">
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../">
        <img class="brand__mark" src="../assets/icons/favicon.svg" alt="" width="32" height="32">
        Beatavo
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="../" data-i18n="nav_videos">Videos</a>
        <a href="../kids/" data-i18n="nav_kids">Kids</a>
        <a href="../favourites/" data-i18n="nav_favourites">Favourites</a>
        <a href="../privacy/" data-i18n="nav_privacy">Privacy</a>
      </nav>
      <label class="lang">
        <span class="visually-hidden" data-i18n="language">Language</span>
        <select class="lang__select" data-language-picker aria-label="Language"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="kids-back">
        <a class="footer-link" href="../" data-i18n="back_home">Back to Beatavo</a>
      </div>

      <section class="challenge challenge--intro" id="introView" aria-labelledby="challengeTitle">
        <h1 id="challengeTitle" data-i18n="challenge_title">Dance challenge</h1>
        <p data-i18n="challenge_subtitle">Five songs, back to back. Can you keep up?</p>
        <p class="challenge__streak" id="introStreak"></p>
        <div class="hero__actions hero__actions--center">
          <button class="btn btn--play" id="startBtn" type="button" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l10.8-6.86a1.06 1.06 0 0 0 0-1.8L9.56 4.24A1.06 1.06 0 0 0 8 5.14Z"/></svg>
            <span data-i18n="challenge_start">Start the challenge</span>
          </button>
        </div>
      </section>

      <section class="challenge" id="playView" hidden aria-label="Dance challenge">
        <div class="challenge__player">
          <div class="player__stage" id="stage"></div>
          <div class="challenge__countdown" id="countdown" role="status" hidden>
            <span class="challenge__countdown-label" data-i18n="challenge_get_ready">Get ready</span>
            <span class="challenge__countdown-num" id="countdownNum"></span>
          </div>
        </div>
        <p class="challenge__progress" id="progressText"></p>
        <p class="player__meta" id="nowPlaying"></p>
      </section>

      <section class="challenge challenge--finish" id="finishView" hidden aria-labelledby="finishTitle">
        <h2 id="finishTitle" tabindex="-1" data-i18n="challenge_finish_title">You danced 5 songs!</h2>
        <p data-i18n="challenge_finish_body">Great job! Come back tomorrow to keep your streak going.</p>
        <p class="challenge__streak" id="finishStreak"></p>
        <div class="hero__actions hero__actions--center">
          <button class="btn btn--play" id="againBtn" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l10.8-6.86a1.06 1.06 0 0 0 0-1.8L9.56 4.24A1.06 1.06 0 0 0 8 5.14Z"/></svg>
            <span data-i18n="btn_again">Dance again</span>
          </button>
          <a class="btn btn--ghost" href="../" data-i18n="back_home">Back to Beatavo</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__tagline" data-i18n="footer_tagline">Videos are hosted on YouTube.</p>
      <nav class="footer-links" aria-label="Footer">
        <a class="btn btn--coffee" href="https://buymeacoffee.com/aussieloo?ref=beatavo"
           target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h14a1 1 0 0 1 1 1v2h1.5A2.5 2.5 0 0 1 23 9.5v1A2.5 2.5 0 0 1 20.5 13H19v1a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V4Zm15 5v2h1.5a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5H19ZM5 21a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
          <span data-i18n="footer_coffee">Buy me a coffee</span>
        </a>
        <a class="footer-link" href="../privacy/" data-i18n="footer_privacy">Privacy</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="../assets/js/challenge.js"></script>
</body>
</html>
